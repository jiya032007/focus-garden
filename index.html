<!DOCTYPE html>
<html>
<head>
    <title>Focus Garden</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <div class="sidebar">
            <div id="timer">00:00</div>
            <div id="switchCount" style="display: none;">Tab switches: 0</div>
            <div class="mode-selector">
                <button id="strictModeBtn" class="mode-btn active">Strict</button>
                <button id="flexibleModeBtn" class="mode-btn">Flexible</button>
            </div>
            <button id="startBtn">Start</button>
            <button id="pauseBtn">Pause</button>
            <button id="resetBtn">Reset</button>
        </div>
        <div class="main-area">
            <h1>Focus Garden</h1>
            <div id="plant-container">
    <div id="plant-wrapper">
        <svg id="plant-svg" width="60" height="60" viewBox="0 0 60 60">
            <path d="M30 50 Q30 30 30 20" stroke="#4a6b52" stroke-width="3" fill="none" stroke-linecap="round"/>
            <path d="M30 25 Q15 20 15 10 Q25 10 30 25" fill="#7cb342"/>
            <path d="M30 25 Q45 20 45 10 Q35 10 30 25" fill="#8fcf52"/>
        </svg>
        <div id="stage">Sprout</div>
    </div>
</div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
